<!DOCTYPE html>
<html>
	<head>
		<title>Fancify Shamcify</title>

		<script src="fancifymytext.js"></script>

	</head>

	<body>
		<h1>Fancify my Text</h1>
		

		<fieldset>
			<legend for="text-input">Text</legend>
			<textarea id="text-input" rows="4" cols="30"></textarea>
		</fieldset>

		<fieldset>
			<legend for="fancy-shmancy">Fancify</legend>
			<button type="button" onclick="largerFont()">Bigger!</button>
			<button type="button" onclick="mooing()">Moo</button>
			<br>
			<label>
				<input type="radio" id="fancy-shmancy" name="text-style" onchange="applyTextStyle()">
				FancyShmancy
			</label>
			<label>
				<input type="radio" id="boring-betty" name="text-style" onchange="applyTextStyle()" checked>
				BoringBetty
			</label>
		</fieldset>
	</body>
</html>
